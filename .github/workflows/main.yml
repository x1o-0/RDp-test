name: Windows Test

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Request GitHub OIDC token
        shell: bash
        run: |
          echo "OIDC token request available: $ACTIONS_ID_TOKEN_REQUEST_URL"
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          
      - name: Check RDP
        shell: powershell
        run: |
          Get-Service TermService
          Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue

      - name: Check Windows users
        shell: powershell
        run: |
          Get-LocalUser | Select-Object Name, Enabled

      - name: Check RDP permissions
        shell: powershell
        run: |
          Get-LocalGroupMember -Group "Remote Desktop Users" -ErrorAction SilentlyContinue
          Get-LocalGroupMember -Group "Administrators" | Where-Object {$_.Name -match "runneradmin"}

      - name: Check RDP firewall
        shell: powershell
        run: |
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Select-Object DisplayName, Enabled, Direction, Action
          
      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host "Windows runner is running..."
          Start-Sleep -Seconds 1800
